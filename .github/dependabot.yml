version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    versioning-strategy: "auto"
    labels:
      - "dependencies"
      - "pnpm"
    reviewers:
      - "DoubledDoge"
    assignees:
      - "DoubledDoge"
    groups:
      production-dependencies:
        patterns:
          - "@fontsource-variable/*"
          - "svelte-meta-tags"
        update-types:
          - "minor"
          - "patch"

      dev-dependencies:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "@commitlint/*"
          - "@biomejs/*"
          - "vite"
          - "lightningcss"
          - "typescript"
          - "browserslist"
          - "uplugin-icons"
        update-types:
          - "minor"
          - "patch"

      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "DoubledDoge"
    assignees:
      - "DoubledDoge"
    groups:
      actions-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
