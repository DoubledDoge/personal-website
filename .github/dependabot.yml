version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    versioning-strategy: "auto"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "pnpm"
    assignees:
      - "DoubledDoge"
    groups:
      production-dependencies:
        patterns:
          - "@fontsource-variable/*"
          - "svelte-meta-tags"
        update-types: ["minor", "patch"]

      dev-dependencies:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "@commitlint/*"
          - "@biomejs/*"
          - "@iconify-json/*"
          - "vite"
          - "lightningcss"
          - "typescript"
          - "browserslist"
          - "unplugin-icons"
        update-types: ["minor", "patch"]

      major-updates:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "DoubledDoge"
    groups:
      actions-updates:
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
